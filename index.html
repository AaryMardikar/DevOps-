<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Feedback Registration Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 400px;
      margin: 50px auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .radio-group {
      display: flex;
      gap: 10px;
    }

    .actions {
      display: flex;
      justify-content: space-between;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #submitBtn {
      background-color: #28a745;
      color: white;
    }

    #resetBtn {
      background-color: #dc3545;
      color: white;
    }

    .error {
      color: red;
      font-size: 12px;
    }

    .message {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1 id="form-title">Student Feedback Registration Form</h1>

    <form id="feedbackForm" novalidate>

      <div class="field">
        <label>Student Name</label>
        <input type="text" id="studentName" name="studentName">
        <small id="studentNameError" class="error"></small>
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" id="email" name="email">
        <small id="emailError" class="error"></small>
      </div>

      <div class="field">
        <label>Mobile</label>
        <input type="tel" id="mobile" name="mobile">
        <small id="mobileError" class="error"></small>
      </div>

      <div class="field">
        <label>Department</label>
        <select id="department" name="department">
          <option value="">Select</option>
          <option>Computer Science</option>
          <option>IT</option>
          <option>Electronics</option>
          <option>Mechanical</option>
          <option>Civil</option>
        </select>
        <small id="departmentError" class="error"></small>
      </div>

      <div class="field">
        <label>Gender</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="Male"> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Other"> Other</label>
        </div>
        <small id="genderError" class="error"></small>
      </div>

      <div class="field">
        <label>Comments</label>
        <textarea id="comments" name="comments"></textarea>
        <small id="commentsError" class="error"></small>
      </div>

      <div class="actions">
        <button type="submit" id="submitBtn">Submit</button>
        <button type="reset" id="resetBtn">Reset</button>
      </div>

      <p id="formMessage" class="message"></p>

    </form>
  </div>

  <!-- ✅ CORRECT PLACE -->
  <script src="./script.js"></script>

</body>

</html>
